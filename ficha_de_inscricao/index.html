<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscrição - Corrida de Rua</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="wrapper">

    <div class="header">
      <span class="badge">Inscrição Aberta</span>
      <h1>Corrida de Rua 2026</h1>
      <p>Preencha seus dados para garantir sua vaga</p>
    </div>

    <!-- onsubmit="return false;" -> o botão não envia nem recarrega a página -->
    <form action="#" onsubmit="return false;">

      <fieldset>
        <legend>Dados Pessoais</legend>

        <div class="row">
          <div class="field">
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
          </div>
          <div class="field">
            <label for="sobrenome">Sobrenome</label>
            <input type="text" id="sobrenome" name="sobrenome" placeholder="Digite seu sobrenome" required>
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label for="idade">Idade</label>
            <input type="number" id="idade" name="idade" min="1" max="120" placeholder="Ex: 25" required>
          </div>
          <div class="field">
            <label for="cpf">CPF</label>
            <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14"
                   pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" title="Use o formato 000.000.000-00" required>
          </div>
        </div>

        <div class="field">
          <label for="genero">Gênero</label>
          <select id="genero" name="genero" required>
            <option value="" selected disabled>Selecione uma opção</option>
            <option value="feminino">Feminino</option>
            <option value="masculino">Masculino</option>
            <option value="outro">Outro</option>
            <option value="prefiro-nao-informar">Prefiro não informar</option>
          </select>
        </div>
      </fieldset>

      <fieldset>
        <legend>Contato</legend>

        <div class="field">
          <label for="telefone">Telefone</label>
          <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>
        </div>

        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
        </div>
      </fieldset>

      <fieldset>
        <legend>Distância da Corrida</legend>

        <div class="options">
          <label class="option-card">
            <input type="radio" name="distancia" value="5km" required>
            <span class="card-inner"><span class="dot"></span>5 km</span>
          </label>
          <label class="option-card">
            <input type="radio" name="distancia" value="10km">
            <span class="card-inner"><span class="dot"></span>10 km</span>
          </label>
          <label class="option-card">
            <input type="radio" name="distancia" value="15km">
            <span class="card-inner"><span class="dot"></span>15 km</span>
          </label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Kit do Atleta</legend>

        <div class="options">
          <label class="option-card">
            <input type="checkbox" name="kit" value="camiseta">
            <span class="card-inner"><span class="box"></span>Camiseta</span>
          </label>
          <label class="option-card">
            <input type="checkbox" name="kit" value="medalha">
            <span class="card-inner"><span class="box"></span>Medalha</span>
          </label>
          <label class="option-card">
            <input type="checkbox" name="kit" value="banana">
            <span class="card-inner"><span class="box"></span>Banana</span>
          </label>
        </div>
        <p class="hint">Selecione todos os itens que deseja incluir na sua inscrição.</p>
      </fieldset>

      <button type="submit" class="submit-btn">Confirmar Inscrição</button>

    </form>

  </div>

</body>
</html>
