<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raízes de Equação do 2º Grau</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="caixa">
    <h1>Equação do 2º Grau</h1>
    <p class="formula">ax² + bx + c = 0</p>

    <div class="campos">
      <div class="campo">
        <label for="a">a</label>
        <input type="number" id="a" step="any" placeholder="1">
      </div>
      <div class="campo">
        <label for="b">b</label>
        <input type="number" id="b" step="any" placeholder="-5">
      </div>
      <div class="campo">
        <label for="c">c</label>
        <input type="number" id="c" step="any" placeholder="6">
      </div>
    </div>

    <button type="button" id="calcular">Calcular raízes</button>

    <div id="saida" class="saida" aria-live="polite"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
